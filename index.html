<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101022"><title>NOVA AI</title>
<style>
:root{color-scheme:dark;--line:#302b50;--text:#f7f5ff;--muted:#aaa6c8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#252052,#0c0b18 58%);font:16px system-ui,sans-serif;color:var(--text);min-height:100vh}.app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:18px}header{display:flex;align-items:center;gap:12px;padding:12px 2px 20px;border-bottom:1px solid var(--line)}.logo{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#06b6d4);font-size:24px;font-weight:800}h1{font-size:21px;margin:0;letter-spacing:.08em}header p{margin:3px 0 0;color:var(--muted);font-size:13px}.status{margin-left:auto;border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:#b8f7d4;font-size:12px}main{flex:1;padding:22px 0 14px}.welcome{text-align:center;padding:30px 12px 20px}.orb{width:76px;height:76px;margin:0 auto 15px;border-radius:28px;background:linear-gradient(135deg,#a78bfa,#22d3ee,#f472b6);display:grid;place-items:center;font-size:36px}h2{font-size:clamp(25px,5vw,36px);margin:8px 0}.welcome p{color:var(--muted);max-width:520px;margin:0 auto;line-height:1.6}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.suggestion{border:1px solid var(--line);border-radius:15px;background:#17162b;color:var(--text);padding:14px;text-align:left;cursor:pointer}.suggestion:hover{border-color:#a78bfa}#chat{display:flex;flex-direction:column;gap:14px}.message{padding:14px 16px;border-radius:18px;max-width:90%;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:linear-gradient(135deg,#6d4bd6,#3657ad)}.assistant{align-self:flex-start;background:#17162b;border:1px solid var(--line)}.error{color:#fecaca}.composer{position:sticky;bottom:0;padding:12px 0 max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#0c0b18 25%)}form{display:flex;gap:9px;border:1px solid #454064;background:#15142a;padding:8px;border-radius:18px}textarea{flex:1;resize:none;max-height:140px;min-height:42px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:10px}.send{border:0;border-radius:13px;padding:0 17px;color:white;background:linear-gradient(135deg,#8b5cf6,#4f46e5);font-weight:700;cursor:pointer}.send:disabled{opacity:.5}.fine{color:var(--muted);font-size:11px;text-align:center;margin:9px 0 0}@media(max-width:520px){.app{padding:12px}.suggestions{grid-template-columns:1fr}.welcome{padding-top:24px}.message{max-width:96%}}
</style></head><body><div class="app"><header><div class="logo">N</div><div><h1>NOVA AI</h1><p>Your ideas, one conversation away</p></div><div class="status">● Assistant</div></header><main><section class="welcome" id="welcome"><div class="orb">✦</div><h2>What can we create today?</h2><p>Ask questions, brainstorm ideas, learn something new, or get help with a project.</p><div class="suggestions"><button class="suggestion">💡 Give me a business idea I can start for free</button><button class="suggestion">💻 Help me build an Android app</button><button class="suggestion">🌍 Explain a difficult topic simply</button><button class="suggestion">✍️ Write an exciting video script</button></div></section><section id="chat" aria-live="polite"></section></main><div class="composer"><form id="form"><textarea id="prompt" placeholder="Message NOVA AI…" rows="1" required></textarea><button class="send" id="send">Send ↑</button></form><p class="fine">AI can make mistakes. Don't enter passwords or private secrets.</p></div></div>
<script>
const form=document.querySelector('#form'),box=document.querySelector('#prompt'),chat=document.querySelector('#chat'),send=document.querySelector('#send'),welcome=document.querySelector('#welcome');
function addMessage(text,who){const el=document.createElement('div');el.className='message '+who;el.textContent=text;chat.appendChild(el);el.scrollIntoView({behavior:'smooth',block:'end'});return el}
document.querySelectorAll('.suggestion').forEach(b=>b.addEventListener('click',()=>{box.value=b.textContent.replace(/^.{2}\s/,'');form.requestSubmit()}));box.addEventListener('input',()=>{box.style.height='auto';box.style.height=Math.min(box.scrollHeight,140)+'px'});
form.addEventListener('submit',async e=>{e.preventDefault();const text=box.value.trim();if(!text)return;welcome.hidden=true;addMessage(text,'user');box.value='';box.style.height='auto';send.disabled=true;send.textContent='…';const loading=addMessage('NOVA AI is thinking…','assistant');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed.');loading.textContent=data.reply||'No response received.'}catch(err){loading.textContent='Could not connect to the AI service. '+err.message+'\n\nCheck that the backend is running and GEMINI_API_KEY is configured as a server-side secret.';loading.classList.add('error')}finally{send.disabled=false;send.textContent='Send ↑';box.focus()}});
</script></body></html>
